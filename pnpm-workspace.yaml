# pnpm 10 settings. Single-package repo (no `packages:` globs needed).
# Canonical home for autoInstallPeers (the .npmrc key is unread by newer pnpm)
# so the lockfile's recorded value is stable across pnpm 10/11 and matches CI.
autoInstallPeers: false

# `overrides` moved here from package.json's `pnpm.overrides`, which pnpm 10
# no longer reads — these pin transitive deps to minimum secure versions.
overrides:
  flatted: '>=3.4.0'
  serialize-javascript: '>=7.0.5'
  devalue: '>=5.6.4'
  node-forge: '>=1.4.0'
  picomatch: '>=4.0.4'
  h3: '>=1.15.9'
  happy-dom: '>=20.8.9'
  brace-expansion: '>=2.0.3'
  srvx: '>=0.11.13'
  yaml: '>=2.8.3'
  lodash: '>=4.18.0'
  defu: '>=6.1.5'
  vite: '>=7.3.2'
  unhead: '>=2.1.13'
  postcss: '>=8.5.10'
  esbuild: '>=0.28.1'

# Allow the build scripts the toolchain needs (tsup/vitest use esbuild).
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - sharp

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@esbuild/aix-ppc64@0.28.1'
  - '@esbuild/android-arm64@0.28.1'
  - '@esbuild/android-arm@0.28.1'
  - '@esbuild/android-x64@0.28.1'
  - '@esbuild/darwin-arm64@0.28.1'
  - '@esbuild/darwin-x64@0.28.1'
  - '@esbuild/freebsd-arm64@0.28.1'
  - '@esbuild/freebsd-x64@0.28.1'
  - '@esbuild/linux-arm64@0.28.1'
  - '@esbuild/linux-arm@0.28.1'
  - '@esbuild/linux-ia32@0.28.1'
  - '@esbuild/linux-loong64@0.28.1'
  - '@esbuild/linux-mips64el@0.28.1'
  - '@esbuild/linux-ppc64@0.28.1'
  - '@esbuild/linux-riscv64@0.28.1'
  - '@esbuild/linux-s390x@0.28.1'
  - '@esbuild/linux-x64@0.28.1'
  - '@esbuild/netbsd-arm64@0.28.1'
  - '@esbuild/netbsd-x64@0.28.1'
  - '@esbuild/openbsd-arm64@0.28.1'
  - '@esbuild/openbsd-x64@0.28.1'
  - '@esbuild/openharmony-arm64@0.28.1'
  - '@esbuild/sunos-x64@0.28.1'
  - '@esbuild/win32-arm64@0.28.1'
  - '@esbuild/win32-ia32@0.28.1'
  - '@esbuild/win32-x64@0.28.1'
  - esbuild@0.28.1
